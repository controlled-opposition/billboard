name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: |
          unformatted=$(nix develop -c gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: nix develop -c go vet ./...
      - name: Build and test
        run: nix build -L
